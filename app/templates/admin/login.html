<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin sign in · {{ s.store_name }}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ asset('css/admin.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="login-brand">{{ s.store_name }} <small>Admin</small></p>
    <h1>Sign in</h1>
    {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin.login') }}" novalidate>
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username" autofocus value="{{ request.form.get('email', '') }}"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary block" type="submit">Sign in</button>
    </form>
    <p class="muted small"><a href="{{ url_for('shop.home') }}">← Back to the store</a></p>
  </main>
</body>
</html>
