{% extends "admin/base.html" %}
{% from "admin/_macros.html" import csrf %}
{% block title %}My account{% endblock %}
{% block content %}
<section class="panel narrow">
  <div class="panel-head"><h2>{{ current_user.email }}</h2><span class="pill">{{ current_user.role }}</span></div>
  <form method="post">
    {{ csrf() }}
    <h3>Change password</h3>
    <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" required autocomplete="current-password"></div>
    <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
    <div class="field"><label for="password2">Confirm new password</label><input id="password2" name="password2" type="password" required minlength="8" autocomplete="new-password"></div>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
